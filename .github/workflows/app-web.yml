name: App Web

# Versión web de la app Flutter. Desde el 2026-11-16 (Victor) es la web
# principal: se publica en la raíz del sitio. La web vieja quedó congelada
# en /vieja/; inscripcion/, registro-express/, activar/, css/, js/ y shared/
# siguen en su lugar porque las páginas de inscripción los usan.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-web
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Compilar
        working-directory: app
        run: flutter build web --release --base-href / --no-wasm-dry-run

      - name: Publicar en la raíz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            # Carpetas que comparte con la web vieja (icons/, assets/): se mezclan.
            for f in app/build/web/*; do
              n=$(basename "$f")
              if [ -d "$f" ] && [ -d "$n" ]; then cp -r "$f"/. "$n"/; else rm -rf "$n"; cp -r "$f" "$n"; fi
            done
            git add -A index.html main.dart.js flutter.js flutter_bootstrap.js flutter_service_worker.js version.json manifest.json favicon.png firebase-messaging-sw.js canvaskit assets icons
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -m "Web: ${GITHUB_SHA::7} [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
