name: App Web

# Versión web de la app Flutter (reemplazo de la PWA vieja, Victor
# 2026-11-14). Se publica de prueba en /nueva/ del mismo sitio de GitHub
# Pages, sin tocar la web actual de la raíz.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-web
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Compilar
        working-directory: app
        run: flutter build web --release --base-href /nueva/ --no-wasm-dry-run

      - name: Publicar en /nueva/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            rm -rf nueva && cp -r app/build/web nueva
            git add -A nueva
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -m "Web de prueba (/nueva/): ${GITHUB_SHA::7} [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
