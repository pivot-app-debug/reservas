name: App Web

# Versión web de la app Flutter. Desde el 2026-11-16 (Victor) es la web
# principal: se publica en la raíz del sitio. La web vieja quedó congelada
# en /vieja/; inscripcion/, registro-express/, activar/, css/, js/ y shared/
# siguen en su lugar porque las páginas de inscripción los usan.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-web
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-24.04
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PIVOT_D65F4 }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Compilar
        working-directory: app
        # WEB_BUILD: número de esta publicación; la app lo compara con
        # web_version.json para pedir actualizar (Victor, 2026-11-20).
        run: |
          flutter build web --release --base-href / --no-wasm-dry-run --dart-define=WEB_BUILD=${{ github.run_number }}
                    echo "{\"build\": ${{ github.run_number }}}" > build/web/web_version.json
          # Cada publicación pide sus archivos con ?v=<número> (Victor, 2026-11-20:
          # la web seguía mostrando la versión vieja por la caché del navegador).
          sed -i 's/"mainJsPath":"main.dart.js"/"mainJsPath":"main.dart.js?v=${{ github.run_number }}"/' build/web/flutter_bootstrap.js
          sed -i 's/src="flutter_bootstrap.js"/src="flutter_bootstrap.js?v=${{ github.run_number }}"/' build/web/index.html
          # Número de esta publicación para la revisión de index.html (Victor, 2026-11-27).
          sed -i 's/__WEB_BUILD__/${{ github.run_number }}/' build/web/index.html
          grep -q 'main.dart.js?v=' build/web/flutter_bootstrap.js && grep -q 'flutter_bootstrap.js?v=' build/web/index.html && ! grep -q '__WEB_BUILD__' build/web/index.html

      # Firebase Hosting (Victor, 2026-11-27): Cloudflare guardaba la web vieja
      # sin hacer caso de las versiones. Aquí firebase.json dice qué nunca se
      # guarda. Solo corre cuando existe el secreto de la cuenta de servicio.
      - name: Preparar sitio para Firebase
        if: ${{ env.FIREBASE_SA != '' }}
        run: |
          for d in inscripcion registro-express activar css js shared vieja nueva; do
            [ -d "$d" ] && cp -r "$d" app/build/web/ || true
          done
          [ -f OneSignalSDKWorker.js ] && cp OneSignalSDKWorker.js app/build/web/ || true

      - name: Publicar en Firebase Hosting
        if: ${{ env.FIREBASE_SA != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PIVOT_D65F4 }}
          channelId: live
          projectId: pivot-d65f4

      - name: Publicar en la raíz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            # Carpetas que comparte con la web vieja (icons/, assets/): se mezclan.
            for f in app/build/web/*; do
              n=$(basename "$f")
              if [ -d "$f" ] && [ -d "$n" ]; then cp -r "$f"/. "$n"/; else rm -rf "$n"; cp -r "$f" "$n"; fi
            done
            git add -A index.html main.dart.js flutter.js flutter_bootstrap.js flutter_service_worker.js version.json web_version.json manifest.json favicon.png firebase-messaging-sw.js canvaskit assets icons
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -m "Web: ${GITHUB_SHA::7} [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
